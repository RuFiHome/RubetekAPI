name: Publish to PyPI

on:
  release:
    types: [published]  # запуск при публикации релиза на GitHub
  workflow_dispatch:    # ручной запуск

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi  # защита окружения (опционально)
    permissions:
      id-token: write  # требуется для OIDC-аутентификации
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
        # Для TestPyPI раскомментируйте:
        # repository-url: https://test.pypi.org/legacy/