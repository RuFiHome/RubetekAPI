[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SAARubetekAPI"]

[project]
name = "saarubetekapi"
dynamic = ["version"]
description = "A Python library for the Rubetek API – control smart home devices, manage scenes, get device status, and automate your Rubetek ecosystem"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AlexVot", email = "alexey.shamray@yandex.ru" }]
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "certifi>=2023.7.22"
]

[project.urls]
Homepage = "https://github.com/RuFiHome/RubetekAPI"
Repository = "https://github.com/RuFiHome/RubetekAPI"
Issues = "https://github.com/RuFiHome/RubetekAPI/issues"

[tool.hatch.version]
source = "vcs"
